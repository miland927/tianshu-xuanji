<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>大六壬 · 天地盘 · 周天</title>
<style>
  :root { --ink:#e7e1d3; --dim:#6f6a60; --zhu:#d9483f; --gold:#f0d9b5; --hair:rgba(242,237,224,.14); }
  * { box-sizing:border-box; }
  body { margin:0; background:#050505; color:var(--ink);
         font:13px/1.9 "PingFang SC","Noto Sans SC",system-ui,sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:40px 24px 80px;
          display:grid; grid-template-columns: 560px 1fr; gap:36px; align-items:start; }
  header { grid-column: 1 / -1; display:flex; align-items:baseline; gap:14px; margin-bottom:4px; }
  h1 { font:500 20px/1.4 "Songti SC","STSong",serif; letter-spacing:.2em; margin:0; }
  header a { margin-left:auto; font-size:11px; color:var(--dim); text-decoration:none;
             border-bottom:1px solid var(--hair); }
  header a:hover { color:var(--ink); }
  .sub { grid-column: 1 / -1; color:var(--dim); font-size:11.5px; margin:-22px 0 8px; }
  .when { margin-left:14px; }
  .when input { background:rgba(255,255,255,.03); border:1px solid var(--hair); color:var(--ink);
                font:11px/1.4 ui-monospace,Consolas,monospace; padding:5px 7px; width:150px; outline:none; }
  .when input:focus { border-color:rgba(242,237,224,.34); }
  .when button { background:none; border:1px solid var(--hair); color:var(--dim); font:11px/1 inherit;
                 padding:6px 10px; cursor:pointer; margin-left:6px; }
  .when button:hover { color:var(--ink); border-color:rgba(242,237,224,.4); }
  #plate { width:100%; height:auto; display:block; }
  .panel h2 { font:500 13px/1.6 "Songti SC","STSong",serif; letter-spacing:.16em; color:var(--dim);
              margin:26px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--hair); }
  .panel h2:first-child { margin-top:0; }
  .kv { display:grid; grid-template-columns: repeat(2, 1fr); gap:2px 16px;
        font:11px/1.9 ui-monospace,Consolas,monospace; color:rgba(231,225,211,.7); }
  .kv b { font-weight:400; color:var(--ink); }
  table.ke { width:100%; border-collapse:collapse; font:12px/1.7 ui-monospace,Consolas,monospace; }
  table.ke th { font-weight:400; font-size:10px; letter-spacing:.2em; color:var(--dim);
                text-align:center; padding:4px 2px; }
  table.ke td { text-align:center; padding:6px 2px; border-top:1px solid var(--hair); }
  table.ke .up { color:var(--ink); font-size:15px; }
  table.ke .down { color:var(--dim); font-size:12px; }
  table.ke .meta { color:rgba(231,225,211,.45); font-size:10px; }
  .chuan { display:flex; gap:10px; }
  .chuan div { flex:1; border:1px solid var(--hair); padding:8px 10px; text-align:center; }
  .chuan .lab { font-size:10px; letter-spacing:.2em; color:var(--zhu); }
  .chuan .zhi { font:500 20px/1.3 "Songti SC","STSong",serif; }
  .chuan .meta { font:10px/1.6 ui-monospace,monospace; color:var(--dim); }
  .keti, .bifa { font:12px/1.8; color:rgba(231,225,211,.78); }
  .keti li, .bifa li { margin:6px 0; }
  .bifa li.item { cursor:pointer; }
  .bifa li.item:hover em { color:#fff; }
  .bifa .src { margin:8px 0 6px; padding:8px 10px; border-left:2px solid rgba(240,217,181,.42);
               background:rgba(240,217,181,.035); max-height:190px; overflow:auto;
               font:11.5px/1.9 "Songti SC","STSong",serif; color:rgba(231,225,211,.72);
               white-space:pre-wrap; }
  .keti em, .bifa em { font-style:normal; color:var(--gold); }
  .keti small, .bifa small { color:var(--dim); font-size:11px; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>大六壬 · 天地盘</h1>
    <a href="/">← 回到周天</a>
  </header>
  <div class="sub">课体与三传由 tianzhi-core 起课，这里只画。天将按昼贵夜贵分配。
    <span class="when"><input id="at" placeholder="2026-11-03 01:30" spellcheck="false" /><button id="go">起课</button></span>
  </div>

  <svg id="plate" viewBox="0 0 720 720" role="img" aria-label="六壬天地盘"></svg>

  <div class="panel">
    <h2>起课</h2>
    <div class="kv" id="kv"></div>

    <h2>四课</h2>
    <table class="ke" id="ke"></table>

    <h2>三传</h2>
    <div class="chuan" id="chuan"></div>

    <h2>课体</h2>
    <ul class="keti" id="keti"></ul>

    <h2>毕法</h2>
    <ul class="bifa" id="bifa"></ul>
  </div>
</div>
<script type="module" src="./src/liuren.js"></script>
</body>
</html>
