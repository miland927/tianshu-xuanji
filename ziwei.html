<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>紫微斗数 · 十二宫 · 周天</title>
<style>
  :root { --ink:#e7e1d3; --dim:#6f6a60; --zhu:#d9483f; --gold:#f0d9b5; --hair:rgba(242,237,224,.14); }
  * { box-sizing:border-box; }
  body { margin:0; background:#050505; color:var(--ink);
         font:13px/1.75 "PingFang SC","Noto Sans SC",system-ui,sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:40px 24px 80px; }
  header { display:flex; align-items:baseline; gap:14px; }
  h1 { font:500 20px/1.4 "Songti SC","STSong",serif; letter-spacing:.2em; margin:0; }
  header a { margin-left:auto; font-size:11px; color:var(--dim); text-decoration:none; border-bottom:1px solid var(--hair); }
  header a:hover { color:var(--ink); }
  .sub { color:var(--dim); font-size:11.5px; margin:8px 0 18px; }
  .when { margin-left:14px; }
  .when input { background:rgba(255,255,255,.03); border:1px solid var(--hair); color:var(--ink);
                font:11px/1.4 ui-monospace,Consolas,monospace; padding:5px 7px; width:150px; outline:none; }
  .when select, .when button { background:none; border:1px solid var(--hair); color:var(--dim);
                font:11px/1 inherit; padding:6px 8px; cursor:pointer; margin-left:6px; }
  .when button:hover { color:var(--ink); border-color:rgba(242,237,224,.4); }

  #board { display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,minmax(148px,auto));
           gap:4px; }
  .palace { border:1px solid var(--hair); padding:8px 9px; position:relative;
            display:flex; flex-direction:column; gap:4px; }
  .palace.ming { border-color:rgba(240,217,181,.55); background:rgba(240,217,181,.035); }
  .palace.shen { box-shadow:inset 0 0 0 1px rgba(217,72,63,.35); }
  .palace .head { display:flex; justify-content:space-between; align-items:baseline; }
  .palace .gname { font:500 13px/1.2 "Songti SC","STSong",serif; letter-spacing:.12em; color:var(--ink); }
  .palace .gz { font:10px/1 ui-monospace,monospace; color:var(--dim); letter-spacing:.06em; }
  .palace .mains { font:500 14px/1.5 "Songti SC","STSong",serif; letter-spacing:.06em; }
  .palace .main { color:var(--ink); }
  .palace .miao { font-size:9px; color:var(--dim); margin-left:2px; }
  .palace .hua { font-size:9px; color:var(--gold); border:1px solid rgba(240,217,181,.4);
                 padding:0 2px; margin-left:3px; vertical-align:1px; }
  .palace .hua.ji { color:var(--zhu); border-color:rgba(217,72,63,.5); }
  .palace .minors { font-size:10px; color:rgba(231,225,211,.5); line-height:1.7; }
  .palace .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:baseline;
                  font:9.5px/1.5 ui-monospace,monospace; color:rgba(231,225,211,.34); }
  .palace .daxian { color:rgba(231,225,211,.45); }

  .center { grid-area: 2 / 2 / 4 / 4; border:1px solid var(--hair); padding:16px 18px;
            display:flex; flex-direction:column; justify-content:center; gap:6px; }  .center .big { font:500 15px/1.5 "Songti SC","STSong",serif; letter-spacing:.16em; }
  .center .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px;
                font:11px/1.8 ui-monospace,Consolas,monospace; color:rgba(231,225,211,.6); }
  .center .kv b { font-weight:400; color:var(--ink); }
  @media (max-width: 820px) {
    #board { grid-template-rows:repeat(4,minmax(120px,auto)); }
    .palace .mains { font-size:12px; }
  }
  .palace { cursor:pointer; }
  .palace:hover { border-color:rgba(242,237,224,.34); }
  .palace.daxian { box-shadow:inset 0 0 0 1px rgba(240,217,181,.55); }
  .palace.liunian { box-shadow:inset 0 0 0 1px rgba(217,72,63,.65); }
  .palace.daxian.liunian { box-shadow:inset 0 0 0 1px rgba(240,217,181,.55), inset 0 0 0 2px rgba(217,72,63,.5); }
  .flow { margin-top:14px; display:none; border:1px solid var(--hair); padding:12px 16px;
          font:11.5px/1.9 ui-monospace,Consolas,monospace; color:rgba(231,225,211,.72); }
  .flow.on { display:block; }
  .flow b { color:var(--gold); font-weight:400; }
  .flow .row { display:flex; flex-wrap:wrap; gap:6px 22px; }
  .flow .row span { white-space:nowrap; }
  .flow .hua { margin-top:6px; color:rgba(231,225,211,.6); }
  .flow .hua em { font-style:normal; color:var(--gold); }
  .flow .close { float:right; background:none; border:0; color:var(--dim); cursor:pointer; font-size:13px; }
  .flow .close:hover { color:var(--ink); }
  #src { position:fixed; right:20px; bottom:20px; width:min(440px,92vw); max-height:64vh;
         background:#0a0a0a; border:1px solid rgba(240,217,181,.35); padding:14px 16px;
         display:none; overflow:auto; z-index:5; }
  #src.on { display:block; }
  #src .top { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  #src h3 { font:500 14px/1.4 "Songti SC","STSong",serif; letter-spacing:.12em; margin:0; color:var(--gold); }
  #src .close { margin-left:auto; background:none; border:0; color:var(--dim); cursor:pointer; font-size:14px; }
  #src .close:hover { color:var(--ink); }
  #src .body { font:12px/1.95 "Songti SC","STSong",serif; color:rgba(231,225,211,.82); white-space:pre-wrap; }
  #src .sec { margin-top:10px; padding-top:8px; border-top:1px solid var(--hair); }
  #src .sec b { display:block; font:9.5px/1.6 ui-monospace,monospace; letter-spacing:.14em; color:var(--zhu); margin-bottom:2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>紫微斗数 · 十二宫</h1>
    <a href="/">← 回到周天</a>
  </header>
  <div class="sub">盘由 tianzhi-core 排，这里只画。庙旺利陷、四化、大限都取自库里的字段。
    <span class="when">
      <input id="birth" value="1996-04-18 13:46" spellcheck="false" />
      <select id="sex"><option value="0">男</option><option value="1">女</option></select>
      <button id="go">排盘</button>
      <input id="ryear" style="width:74px" title="看哪一年的流年" />
      <button id="rgo">看流年</button>
    </span>
  </div>

  <div id="board"></div>
  <div id="flow" class="flow"></div>
</div>
<div id="src">
  <div class="top"><h3>原文</h3><button class="close" type="button" title="关闭">✕</button></div>
  <div class="body"></div>
</div>
<script type="module" src="./src/ziwei.js"></script>
</body>
</html>
