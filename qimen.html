<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>奇门遁甲 · 九宫 · 周天</title>
<style>
  :root { --ink:#e7e1d3; --dim:#6f6a60; --zhu:#d9483f; --gold:#f0d9b5; --hair:rgba(242,237,224,.14); }
  * { box-sizing:border-box; }
  body { margin:0; background:#050505; color:var(--ink);
         font:13px/1.9 "PingFang SC","Noto Sans SC",system-ui,sans-serif; }
  .wrap { max-width:1120px; margin:0 auto; padding:40px 24px 80px;
          display:grid; grid-template-columns: 540px 1fr; gap:40px; align-items:start; }
  header { grid-column:1/-1; display:flex; align-items:baseline; gap:14px; }
  h1 { font:500 20px/1.4 "Songti SC","STSong",serif; letter-spacing:.2em; margin:0; }
  header a { margin-left:auto; font-size:11px; color:var(--dim); text-decoration:none; border-bottom:1px solid var(--hair); }
  header a:hover { color:var(--ink); }
  .sub { grid-column:1/-1; color:var(--dim); font-size:11.5px; margin:-18px 0 6px; }
  .when { margin-left:14px; }
  .when input { background:rgba(255,255,255,.03); border:1px solid var(--hair); color:var(--ink);
                font:11px/1.4 ui-monospace,Consolas,monospace; padding:5px 7px; width:150px; outline:none; }
  .when button { background:none; border:1px solid var(--hair); color:var(--dim); font:11px/1 inherit;
                 padding:6px 10px; cursor:pointer; margin-left:6px; }
  .when button:hover { color:var(--ink); border-color:rgba(242,237,224,.4); }

  #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .gong { position:relative; aspect-ratio:1/1; border:1px solid var(--hair); padding:9px 10px;
          display:flex; flex-direction:column; justify-content:space-between; }
  .gong .top { display:flex; justify-content:space-between; align-items:baseline; }
  .gong .shen { font-size:10px; letter-spacing:.1em; color:rgba(231,225,211,.42); }
  .gong .corner { font:9px/1 ui-monospace,monospace; color:rgba(231,225,211,.22); letter-spacing:.06em; }
  .gong .mid { display:flex; align-items:baseline; gap:7px; }
  .gong .tian { font:500 22px/1 "Songti SC","STSong",serif; color:var(--ink); }
  .gong .star { font-size:11px; color:rgba(231,225,211,.6); }
  .gong .door { font:500 14px/1.4 "Songti SC","STSong",serif; letter-spacing:.16em; color:rgba(231,225,211,.8); }
  .gong .di { position:absolute; right:9px; bottom:8px; font:11px/1 ui-monospace,monospace;
              color:rgba(231,225,211,.38); }
  .gong.zhifu { border-color:rgba(240,217,181,.6); }
  .gong.zhishi { border-color:rgba(217,72,63,.6); }
  .gong.zhifu .corner, .gong.zhishi .corner { color:var(--gold); }
  .gong.center { background:rgba(255,255,255,.015); }
  .gong.center .tian { color:rgba(231,225,211,.5); }

  .panel h2 { font:500 13px/1.6 "Songti SC","STSong",serif; letter-spacing:.16em; color:var(--dim);
              margin:24px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--hair); }
  .panel h2:first-child { margin-top:0; }
  .kv { display:grid; grid-template-columns:repeat(2,1fr); gap:2px 16px;
        font:11px/1.9 ui-monospace,Consolas,monospace; color:rgba(231,225,211,.7); }
  .kv b { font-weight:400; color:var(--ink); }
  .geju { list-style:none; padding:0; margin:0; font-size:12px; }
  .geju li { padding:7px 0; border-top:1px solid var(--hair); }
  .geju .name { color:var(--gold); }
  .geju .xiong .name { color:var(--zhu); }
  .geju small { display:block; color:var(--dim); font-size:11px; }
  .geju li[data-cite] { cursor:pointer; }
  .geju li[data-cite]:hover .name { color:#fff; }
  .geju .src { margin:7px 0 2px; padding:8px 10px; border-left:2px solid rgba(240,217,181,.42);
               background:rgba(240,217,181,.035); max-height:180px; overflow:auto;
               font:11.5px/1.9 "Songti SC","STSong",serif; color:rgba(231,225,211,.72);
               white-space:pre-wrap; }
  @media (max-width: 900px) { .wrap { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>奇门遁甲 · 九宫</h1>
    <a href="/qimen3d.html">3D 方阵 →</a>
    <a href="/" style="margin-left:14px">← 回到周天</a>
  </header>
  <div class="sub">局与盘由 tianzhi-core 起，这里只画。默认超神接气置闰、转盘。
    <span class="when"><input id="at" placeholder="2026-11-03 15:00" spellcheck="false" /><button id="go">起局</button></span>
  </div>

  <div id="grid"></div>

  <div class="panel">
    <h2>起局</h2>
    <div class="kv" id="kv"></div>
    <h2>直符直使</h2>
    <div class="kv" id="zhifu"></div>
    <h2>成格</h2>
    <ul class="geju" id="geju"></ul>
  </div>
</div>
<script type="module" src="./src/qimen.js"></script>
</body>
</html>
